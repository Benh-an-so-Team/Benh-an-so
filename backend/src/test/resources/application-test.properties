# ==========================================================
# Test Profile: H2 In-Memory Database with Flyway
# ==========================================================

# Use H2 in-memory for tests - override MySQL defaults
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - dialect is auto-detected by Hibernate 6
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Flyway disabled for H2 tests (Flyway migrations use MySQL syntax and are tested via Testcontainers)
spring.flyway.enabled=false


# H2 Console disabled in tests
spring.h2.console.enabled=false

# JWT for test context
app.jwt.secret=TEST_SECRET_32_CHARS_LONG_FOR_TEST_ONLY_!!
app.jwt.expiration-ms=3600000
