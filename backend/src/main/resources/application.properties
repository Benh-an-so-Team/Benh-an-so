# ==========================================================
# Application & Profile Settings
# ==========================================================
spring.application.name=benh-so-an

# Mặc định kích hoạt profile 'local' (sẽ nạp thêm application-local.properties)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==========================================================
# Server
# ==========================================================
server.port=8080
server.servlet.context-path=/api/v1

# ==========================================================
# Database Base Configuration
# ==========================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Mặc định lấy từ biến môi trường hoặc profile con
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digital_medical_record?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================================
# JPA / Hibernate
# ==========================================================
# Dùng Flyway để quản lý schema nên KHÔNG để Hibernate tự tạo bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ==========================================================
# Flyway Migration
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
spring.sql.init.mode=never


# ==========================================================
# File Upload
# ==========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary attachment storage. Keep credentials in environment variables only.
clinical-attachments.max-file-size=10MB
clinical-attachments.allowed-content-types[0]=image/jpeg
clinical-attachments.allowed-content-types[1]=image/png
clinical-attachments.allowed-content-types[2]=application/pdf
clinical-attachments.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
clinical-attachments.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
clinical-attachments.cloudinary.api-key=${CLOUDINARY_API_KEY:}
clinical-attachments.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
clinical-attachments.cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:benh-soan/clinical-results}
clinical-attachments.cloudinary.signed-url-ttl=${CLOUDINARY_SIGNED_URL_TTL:PT5M}

# ==========================================================
# Jackson / Date Formatter
# ==========================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================================
# Encoding
# ==========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================================
# JWT Configuration
# ==========================================================
# 15 phút
app.jwt.expiration-ms=900000
app.jwt.secret=${JWT_SECRET:DEV_SECRET_CHANGE_ME_MUST_BE_32_CHARS_LONG_123}

# ==========================================================
# Swagger UI / API Docs
# ==========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ==========================================================
# H2 Console & Logging
# ==========================================================
spring.h2.console.enabled=false
logging.level.root=INFO

# Appointment reminder
appointment.reminder.enabled=true
appointment.reminder.advance-hours=24
appointment.reminder.scan-interval-ms=60000
appointment.reminder.zone-id=Asia/Ho_Chi_Minh

# Security anomaly detection (medical record access)
app.security.anomaly.max-views-per-hour=20
app.security.anomaly.working-hours-start=07:00
app.security.anomaly.working-hours-end=18:00
app.security.anomaly.zone-id=Asia/Ho_Chi_Minh

# Two-factor authentication challenge cleanup (NCL-01-CN-006)
# Removes only consumed/expired challenge records older than retention-days.
# Runs daily at 03:00. Set enabled=false to disable the scheduled job.
app.security.two-factor.challenge.cleanup.enabled=true
app.security.two-factor.challenge.cleanup.retention-days=30
app.security.two-factor.challenge.cleanup.cron=0 0 3 * * *

# Mock electronic-prescription gateway. Start a separate mock process with
# SERVER_PORT=8081 and INTERCONNECTION_MOCK_GATEWAY_ENABLED=true for demos.
interconnection.mock-gateway.enabled=${INTERCONNECTION_MOCK_GATEWAY_ENABLED:false}
interconnection.mock-gateway.mode=${INTERCONNECTION_MOCK_GATEWAY_MODE:ACCEPT}
interconnection.mock-gateway.no-response-delay=${INTERCONNECTION_MOCK_GATEWAY_NO_RESPONSE_DELAY:PT15S}

# Personal-data request deadline review (NCL-15-CN-006 TC-02).
# Enabled by default so administrators are alerted about approaching/overdue
# requests; consistent with appointment.reminder.enabled=true.
personal-data-request.deadline-check.enabled=true
personal-data-request.deadline-check.scan-interval-ms=60000
personal-data-request.deadline-check.upcoming-window-hours=24

# ==========================================================
# CORS Configuration
# ==========================================================
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://localhost:4200,https://*.vercel.app}

